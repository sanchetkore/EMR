version: '3.8'

services:

  redis:
    image: redis:7
    container_name: emr_redis
    restart: always
    ports:
      - "7400:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emr_backend
    restart: always
    ports:
      - "9000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./backend:/app

volumes:
  redisdata:
